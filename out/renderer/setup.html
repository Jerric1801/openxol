<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meeting Analysis - Setup</title>
  <script type="module" crossorigin src="./assets/setup-C-7eaYbd.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/styles-CNE5wOyx.css">
</head>
<body>
    <div class="setup-container">
        <header class="setup-header">
            <svg class="ox-logo" width="64" height="64" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="45" fill="none" stroke="currentColor" stroke-width="8" />
                <path d="M30 30 L70 70 M70 30 L30 70" stroke="currentColor" stroke-width="8" stroke-linecap="round" />
            </svg>
            <h1>Initialize OpenXol</h1>
            <p>Setting up your private intelligence engine</p>
        </header>

        <div class="setup-content">
            <div class="setup-step card" id="whisperStep">
                <div class="setup-step-title">Transcription Core</div>
                <div class="setup-step-status">
                    <span class="status-icon pending" id="whisperIcon"></span>
                    <span id="whisperStatus">Awaiting Initialization</span>
                </div>
                <div class="progress-bar-setup" style="display: none;" id="whisperProgress">
                    <div class="progress-fill-setup" id="whisperProgressFill"></div>
                </div>
                <div class="setup-message" id="whisperMessage"></div>
            </div>

            <div class="setup-step card" id="ffmpegStep">
                <div class="setup-step-title">Media Processor</div>
                <div class="setup-step-status">
                    <span class="status-icon pending" id="ffmpegIcon"></span>
                    <span id="ffmpegStatus">Awaiting Initialization</span>
                </div>
                <div class="progress-bar-setup" style="display: none;" id="ffmpegProgress">
                    <div class="progress-fill-setup" id="ffmpegProgressFill"></div>
                </div>
                <div class="setup-message" id="ffmpegMessage"></div>
            </div>

            <div class="setup-step card" id="modelStep">
                <div class="setup-step-title">Neural Model (Whisper)</div>
                <div class="setup-step-status">
                    <span class="status-icon pending" id="modelIcon"></span>
                    <span id="modelStatus">Awaiting Initialization</span>
                </div>
                <div class="progress-bar-setup" style="display: none;" id="modelProgress">
                    <div class="progress-fill-setup" id="modelProgressFill"></div>
                </div>
                <div class="setup-message" id="modelMessage"></div>
            </div>
        </div>

        <div id="errorContainer"></div>
        <div id="successContainer" style="display: none;">
            <div class="success-message card">
                ✅ Engine initialized! You're ready to transcribe.
            </div>
        </div>

        <div class="setup-actions">
            <button class="btn-primary" id="startSetupBtn">Initialize Engine</button>
            <button class="btn-primary" id="continueBtn" style="display: none;">Launch Workspace</button>
        </div>
    </div>

</body>
</html>
