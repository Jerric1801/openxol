appId: com.openxol.app
productName: OpenXol
directories:
  output: build
files:
  - 'out/**/*'
  - 'src/renderer/**/*'
  - 'resources/**/*'
  - 'assets/**/*'
  - 'package.json'
extraFiles:
  - from: 'bin'
    to: 'Resources/bin'
    filter:
      - '**/*'
asarUnpack:
  - 'bin/**/*'
mac:
  category: public.app-category.productivity
  target: dmg
  icon: assets/icon.icns
win:
  target: nsis
  icon: assets/icon.ico
linux:
  target: AppImage
  icon: assets/icon.png
