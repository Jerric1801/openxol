appId: com.openxol.app
productName: OpenXol
directories:
  output: build
files:
  - 'out/**/*'
  - 'src/renderer/**/*'
  - 'resources/**/*'
  - 'assets/**/*'
  - 'package.json'
extraFiles:
  - from: 'bin'
    to: 'Resources/bin'
    filter:
      - '**/*'
asarUnpack:
  - 'bin/**/*'

# macOS — universal binary (arm64 + x64 in one DMG)
# bin/darwin/whisper and bin/darwin/ffmpeg MUST be universal binaries (built with lipo).
# Dev shortcut: build:mac:dev uses host arch only (no lipo required).
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: universal
  icon: assets/icon.icns
  # Required entitlements for microphone and system audio capture (recording feature)
  entitlementsInherit: build/entitlements.mac.plist

# Windows — x64 only
win:
  target:
    - target: nsis
      arch: x64
  icon: assets/icon.ico

# Linux — x64 only
linux:
  target:
    - target: AppImage
      arch: x64
  icon: assets/icon.png
